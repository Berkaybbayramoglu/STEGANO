<svg width="100%" viewBox="0 0 680 290" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace">
<title>Discrete Artificial Bee Colony — pixel selection</title>
<desc>Bees roam over a pixel grid and select the fittest pixels, which turn amber.</desc>
<style>
  .abc-lbl  { fill:#C2C0B6; font-size:13px; letter-spacing:2px; }
  .abc-cap  { fill:#73726C; font-size:12px; }
  .abc-cell { fill:#262624; stroke:#73726C; stroke-width:1; }
  .abc-sel  { animation: abcSelect 7s ease-in-out infinite; }
  .abc-wg   { animation: abcWing 0.12s linear infinite; transform-origin:center; }
  .abc-bee  { animation-duration:7s; animation-timing-function:ease-in-out; animation-iteration-count:infinite; }
  @keyframes abcSelect { 0%,40% { fill:#262624; stroke:#73726C; } 55%,100% { fill:#EF9F27; stroke:#a86a0a; } }
  @keyframes abcWing   { 0%,100% { transform:scaleY(1);} 50% { transform:scaleY(0.45);} }
  @keyframes abcBee1 { 0%{transform:translate(80px,60px)} 25%{transform:translate(230px,90px)} 50%{transform:translate(170px,180px)} 75%{transform:translate(300px,140px)} 100%{transform:translate(80px,60px)} }
  @keyframes abcBee2 { 0%{transform:translate(320px,70px)} 25%{transform:translate(150px,150px)} 50%{transform:translate(280px,200px)} 75%{transform:translate(110px,100px)} 100%{transform:translate(320px,70px)} }
  @keyframes abcBee3 { 0%{transform:translate(200px,200px)} 25%{transform:translate(310px,120px)} 50%{transform:translate(90px,90px)} 75%{transform:translate(240px,170px)} 100%{transform:translate(200px,200px)} }
  @media (prefers-reduced-motion: reduce) {
    .abc-bee,.abc-wg { animation:none; }
    .abc-sel { fill:#EF9F27; stroke:#a86a0a; }
  }
</style>

<text class="abc-lbl" x="200" y="36" text-anchor="middle">Safe pixel pool</text>

<g>
  <rect class="abc-cell" x="60"  y="50" width="34" height="34" rx="3"/>
  <rect class="abc-cell abc-sel" x="98"  y="50" width="34" height="34" rx="3" style="animation-delay:0.3s"/>
  <rect class="abc-cell" x="136" y="50" width="34" height="34" rx="3"/>
  <rect class="abc-cell" x="174" y="50" width="34" height="34" rx="3"/>
  <rect class="abc-cell abc-sel" x="212" y="50" width="34" height="34" rx="3" style="animation-delay:1.1s"/>
  <rect class="abc-cell" x="250" y="50" width="34" height="34" rx="3"/>
  <rect class="abc-cell" x="288" y="50" width="34" height="34" rx="3"/>
  <rect class="abc-cell" x="326" y="50" width="34" height="34" rx="3"/>

  <rect class="abc-cell" x="60"  y="88" width="34" height="34" rx="3"/>
  <rect class="abc-cell" x="98"  y="88" width="34" height="34" rx="3"/>
  <rect class="abc-cell abc-sel" x="136" y="88" width="34" height="34" rx="3" style="animation-delay:0.7s"/>
  <rect class="abc-cell" x="174" y="88" width="34" height="34" rx="3"/>
  <rect class="abc-cell" x="212" y="88" width="34" height="34" rx="3"/>
  <rect class="abc-cell" x="250" y="88" width="34" height="34" rx="3"/>
  <rect class="abc-cell abc-sel" x="288" y="88" width="34" height="34" rx="3" style="animation-delay:1.5s"/>
  <rect class="abc-cell" x="326" y="88" width="34" height="34" rx="3"/>

  <rect class="abc-cell abc-sel" x="60"  y="126" width="34" height="34" rx="3" style="animation-delay:0.9s"/>
  <rect class="abc-cell" x="98"  y="126" width="34" height="34" rx="3"/>
  <rect class="abc-cell" x="136" y="126" width="34" height="34" rx="3"/>
  <rect class="abc-cell" x="174" y="126" width="34" height="34" rx="3"/>
  <rect class="abc-cell" x="212" y="126" width="34" height="34" rx="3"/>
  <rect class="abc-cell abc-sel" x="250" y="126" width="34" height="34" rx="3" style="animation-delay:1.9s"/>
  <rect class="abc-cell" x="288" y="126" width="34" height="34" rx="3"/>
  <rect class="abc-cell" x="326" y="126" width="34" height="34" rx="3"/>

  <rect class="abc-cell" x="60"  y="164" width="34" height="34" rx="3"/>
  <rect class="abc-cell" x="98"  y="164" width="34" height="34" rx="3"/>
  <rect class="abc-cell" x="136" y="164" width="34" height="34" rx="3"/>
  <rect class="abc-cell abc-sel" x="174" y="164" width="34" height="34" rx="3" style="animation-delay:1.3s"/>
  <rect class="abc-cell" x="212" y="164" width="34" height="34" rx="3"/>
  <rect class="abc-cell" x="250" y="164" width="34" height="34" rx="3"/>
  <rect class="abc-cell" x="288" y="164" width="34" height="34" rx="3"/>
  <rect class="abc-cell abc-sel" x="326" y="164" width="34" height="34" rx="3" style="animation-delay:2.1s"/>
</g>

<g class="abc-bee" style="animation-name:abcBee1">
  <ellipse class="abc-wg" cx="-6" cy="-7" rx="7" ry="4" fill="#e8eef2" stroke="#5a6b73" stroke-width="0.6" opacity="0.8"/>
  <ellipse cx="0" cy="0" rx="8" ry="5.5" fill="#F2A623" stroke="#2a1f06" stroke-width="0.8"/>
  <rect x="-1" y="-5" width="2.5" height="11" fill="#1c1c1c" rx="0.5"/>
  <rect x="3" y="-4" width="2.5" height="9" fill="#1c1c1c" rx="0.5"/>
  <circle cx="-7" cy="0" r="3.4" fill="#241d10"/>
</g>
<g class="abc-bee" style="animation-name:abcBee2">
  <ellipse class="abc-wg" cx="-6" cy="-7" rx="7" ry="4" fill="#e8eef2" stroke="#5a6b73" stroke-width="0.6" opacity="0.8"/>
  <ellipse cx="0" cy="0" rx="8" ry="5.5" fill="#F2A623" stroke="#2a1f06" stroke-width="0.8"/>
  <rect x="-1" y="-5" width="2.5" height="11" fill="#1c1c1c" rx="0.5"/>
  <rect x="3" y="-4" width="2.5" height="9" fill="#1c1c1c" rx="0.5"/>
  <circle cx="-7" cy="0" r="3.4" fill="#241d10"/>
</g>
<g class="abc-bee" style="animation-name:abcBee3">
  <ellipse class="abc-wg" cx="-6" cy="-7" rx="7" ry="4" fill="#e8eef2" stroke="#5a6b73" stroke-width="0.6" opacity="0.8"/>
  <ellipse cx="0" cy="0" rx="8" ry="5.5" fill="#F2A623" stroke="#2a1f06" stroke-width="0.8"/>
  <rect x="-1" y="-5" width="2.5" height="11" fill="#1c1c1c" rx="0.5"/>
  <rect x="3" y="-4" width="2.5" height="9" fill="#1c1c1c" rx="0.5"/>
  <circle cx="-7" cy="0" r="3.4" fill="#241d10"/>
</g>

<g>
  <rect x="400" y="60" width="18" height="18" rx="3" fill="#EF9F27" stroke="#a86a0a" stroke-width="1"/>
  <text class="abc-cap" x="426" y="73">selected pixel (high fitness)</text>
  <rect x="400" y="90" width="18" height="18" rx="3" fill="#262624" stroke="#73726C" stroke-width="1"/>
  <text class="abc-cap" x="426" y="103">candidate pixel</text>
</g>

<text class="abc-cap" x="200" y="232" text-anchor="middle">employed &#8594; onlooker &#8594; scout bees search for best pixels</text>
<text class="abc-cap" x="200" y="256" text-anchor="middle">f(indices) = &#931; pixel intensity &#8594; maximize</text>
</svg>
