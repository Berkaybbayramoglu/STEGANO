# pyproject.toml — maturin build configuration
# ─────────────────────────────────────────────
# maturin is the PEP 517 build backend that compiles the Rust extension
# and installs the resulting .so into the active Python environment.
#
# Compile (development mode — editable install, no wheel):
#   pip install maturin
#   maturin develop --release
#
# Build a distributable wheel (for submission / CI):
#   maturin build --release
#
# The compiled module will be importable as:
#   import stegano_core

[build-system]
requires      = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name            = "stegano-core"
version         = "0.1.0"
description     = "Adaptive Quadtree + Discrete ABC + LSB-Matching steganography engine (Rust/PyO3)"
requires-python = ">=3.9"
dependencies    = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "scikit-image>=0.21.0",
    "rich>=13.5.2",
    "psutil>=5.9.5",
    "cryptography>=41.0.3",
    "matplotlib>=3.7.2",
    "questionary>=2.0.0"
]

[project.scripts]
stegano = "stegano_app.cli:main"
stegano-product = "stegano_app.product_cli:main"

[tool.maturin]
# Activate the PyO3 "extension-module" feature so the .so does not link
# against libpython (required for manylinux-compatible wheels).
features = ["pyo3/extension-module"]

# Explicitly include the Python packages
python-packages = ["stegano_app", "stegano_core", "src"]
include = ["stegano_app/**/*.txt", "stegano_app/**/*.ansi"]
